<html>
  <head>
    <style>
        .mainframe {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          border: 0;
          box-sizing: border-box;
          scrolling: auto;
        }
    </style>
  </head>
</html>
<body>
  <iframe id="ccframe" class="mainframe" src="./proxy.html"></iframe>
  <script>
    /* 
      This script modifies the Cook County election results page: 
        https://electionnight.cookcountyclerkil.gov/#
      by doing the following:
        1. Auto-refreshes the page every 5 minutes
        2. Hides all contests not relevant to Wheeling Township
    */
    const ccframe = document.getElementById('ccframe');
    const refreshInterval = 300000; // 5 minutes
    
    // Define which races to KEEP (match by text)
    const keepRaces = [
      'Senator, U.S.',
      'Governor & Lieutenant Governor, Illinois',
      'Attorney General, State of Illinois',
      'Secretary of State, State of Illinois',
      'Comptroller, State of Illinois',
      'Treasurer, State of Illinois',
      'U.S. Representative, 5th District',
      'State Senator, 27th District',
      'State Representative, 54th District',
      'Commissioner, Water Reclamation Dist',
      'Commissioner, Water Reclamation Dist 2 yr',
      'Board President, Cook County',
      'Clerk, Cook County',
      'Sheriff, Cook County',
      'Treasurer, Cook County',
      'Assessor, Cook County',
      'Commissioner, County Board 9th District',
      'Board of Review, 1st District',
      'Cook County, Millionaire Tax Amendment',
      'High School District 214, Issue Bonds'
    ];    
    function applyModifications() {
      const proxyDoc = ccframe.contentWindow.document;
      const innerFrame = proxyDoc.querySelector('iframe');
      if (!innerFrame) return; // inner iframe not loaded yet
      const ccDoc = innerFrame.contentWindow.document;
      if (!ccDoc || !ccDoc.querySelector('.panel.contest')) return; // content not ready
    
      const searchPanel = ccDoc.querySelector('.row.searchText.small.p-3.mb-3');
      if (searchPanel) searchPanel.style.display = 'none';
    
      const racePanel = ccDoc.querySelector('.row.panel.mb-3.pt-2.pb-2.pl-4.search');
      if (racePanel) racePanel.style.display = 'none';
    
      const contestPanels = ccDoc.querySelectorAll('.panel.contest');
      for (const panel of contestPanels) {
        const text = panel.textContent;
        panel.style.display = keepRaces.some(r => text.includes(r)) ? 'block' : 'none';
      }
    }
    
    // Hook into the inner iframe's load event
    const proxyDoc = ccframe.contentWindow.document;
    const innerFrame = proxyDoc.querySelector('iframe');
    innerFrame.addEventListener('load', applyModifications);
    
    // Auto-refresh every 5 minutes
    setInterval(function () {
      const baseSrc = innerFrame.src.split('?')[0];
      innerFrame.src = baseSrc + '?t=' + Date.now();
    }, refreshInterval);
  </script>
</body>
