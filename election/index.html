<html>
  <head>
    <style>
        .mainframe {
          margin: 0;
          padding: 0;
          width: 100%;
          height: 100%;
          border: 0;
          box-sizing: border-box;
          scrolling: auto;
        }
    </style>
  </head>
</html>
<body>
  <iframe id="ccframe" class="mainframe" src="./proxy.html"></iframe>
  <script>
    /* 
      This script modifies the Cook County election results page: 
        https://electionnight.cookcountyclerkil.gov/#
      by doing the following:
        1. Auto-refreshes the page every 5 minutes
        2. Hides all contests not relevant to Wheeling Township
    */
    const ccframe = document.getElementById('ccframe');
    const refreshInterval = 300000; // 5 MINUTES = 300000 ms
    const shownTables = [0,1,2, 8, 12,13,22, 57,58,61,63,69,70,71,72,73, 102,103,104,114];
    
    function applyModifications() {
      // Re-fetch the document EVERY time — it's a fresh object after each load
      const ccDoc = ccframe.contentWindow.document;
    
      const searchPanel = ccDoc.querySelector('.row.searchText.small.p-3.mb-3');
      if (searchPanel) searchPanel.style.display = 'none';
    
      const racePanel = ccDoc.querySelector('.row.panel.mb-3.pt-2.pb-2.pl-4.search');
      if (racePanel) racePanel.style.display = 'none';
    
      const contestPanels = ccDoc.querySelectorAll('.panel.contest');
      for (let i = 0; i < contestPanels.length; i++) {
        contestPanels[i].style.display = shownTables.includes(i) ? 'block' : 'none';
      }
    }
    
    // Run the DOM mods only after the iframe has actually loaded
    ccframe.addEventListener('load', applyModifications);
    
    // Refresh by reloading the iframe every 5 minutes
    setInterval(function () {
      const baseSrc = ccframe.src.split('?')[0]; // strip any previous ?timestamp
      ccframe.src = baseSrc + '?t=' + Date.now();
    }, refreshInterval);   
  </script>
</body>
